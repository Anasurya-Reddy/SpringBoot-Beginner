<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      .card {
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
        transition: 0.3s;
        width: 40%;
      }

      .card:hover {
        box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2);
      }

      .container {
        padding: 2px 16px;
      }
    </style>
  </head>
  <body>
    <h2>Card</h2>

    <div class="card">
      <img id = "image" src="img/john.png" alt="Avatar" style="width: 50%" />
      <div class="container">
        <h4 id = "name"><b>John Doe</b></h4>
        <p id = "gender">Male</p>
        <button onclick="toggle()">Toggle</button>
      </div>
    </div>
    
    <script src = "js/site.js"></script>
  </body>
</html>
